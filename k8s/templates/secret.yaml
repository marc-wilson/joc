kind: Secret
apiVersion: v1
metadata:
  name: joc-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  # `required` fails the deploy on an empty value rather than starting a broken server.
  MONGODB_URI: {{ required "mongodb_uri is required (the MONGODB_URI secret)" .Values.mongodb_uri | b64enc }}
  JOC_GITHUB_CLIENT_ID: {{ required "github_client_id is required (the JOC_GITHUB_CLIENT_ID variable)" .Values.github_client_id | b64enc }}
  JOC_GITHUB_CLIENT_SECRET: {{ required "github_client_secret is required (the JOC_GITHUB_CLIENT_SECRET secret)" .Values.github_client_secret | b64enc }}
  # The GitHub App's; optional, so empty is fine (the server then leaves GitHub to the plugins).
  JOC_GITHUB_APP_PRIVATE_KEY: {{ .Values.github_app_private_key | default "" | b64enc }}
  JOC_GITHUB_WEBHOOK_SECRET: {{ .Values.github_webhook_secret | default "" | b64enc }}
