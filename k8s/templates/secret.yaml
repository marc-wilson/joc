kind: Secret
apiVersion: v1
metadata:
  name: joc-secrets
  namespace: joc
type: Opaque
data:
  # `required` fails the deploy on an empty value: without JOC_TOKEN the site would be open.
  MONGODB_URI: {{ required "mongodb_uri is required (the MONGODB_URI secret)" .Values.mongodb_uri | b64enc }}
  JOC_TOKEN: {{ required "joc_token is required (the JOC_TOKEN secret)" .Values.joc_token | b64enc }}
