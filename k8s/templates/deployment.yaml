apiVersion: apps/v1
kind: Deployment
metadata:
  name: joc-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: joc-app
spec:
  # Exactly 1 replica: live updates (SSE) fan out in-process, so a second replica would
  # miss events published on the other one. Scale out only once the server moves to
  # Mongo change streams.
  replicas: 1
  # A deploy starts the new pod first and stops the old one only once the new one is ready, so
  # there's no downtime. For those few seconds two pods serve: a dashboard streaming from the
  # old pod doesn't hear reports landing on the new one until the old pod ends its stream on
  # SIGTERM; the browser then reconnects to the new pod, whose snapshot catches it up. Every
  # write goes to MongoDB, so nothing is lost.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: joc-app
  template:
    metadata:
      labels:
        app: joc-app
    spec:
      # Covers the preStop pause (10s) plus the server's own shutdown (at most 10s).
      terminationGracePeriodSeconds: 30
      containers:
        - name: joc
          image: '{{ .Values.image_repository }}:{{ required "image_tag is required (the commit SHA)" .Values.image_tag }}'
          imagePullPolicy: {{ .Values.image_pull_policy }}
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  # From templates/secret.yaml, filled from GitHub secrets at deploy time.
                  name: joc-secrets
                  key: MONGODB_URI
            # GitHub sign-in. The server won't start in production without both.
            - name: JOC_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: joc-secrets
                  key: JOC_GITHUB_CLIENT_ID
            - name: JOC_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: joc-secrets
                  key: JOC_GITHUB_CLIENT_SECRET
            # The GitHub App (docs/github-app.md). Empty values leave GitHub to the plugins.
            - name: JOC_GITHUB_APP_ID
              value: {{ .Values.github_app_id | default "" | quote }}
            - name: JOC_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: joc-secrets
                  key: JOC_GITHUB_APP_PRIVATE_KEY
            - name: JOC_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: joc-secrets
                  key: JOC_GITHUB_WEBHOOK_SECRET
            - name: JOC_PUBLIC_URL
              value: {{ required "public_url is required" .Values.public_url | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          # A new pod takes traffic only once it reaches MongoDB, so a release that can't
          # never replaces the running one. After that, readiness doesn't depend on MongoDB:
          # a database blip shouldn't take the only pod out of the Service.
          startupProbe:
            httpGet:
              path: /health/db
              port: 3000
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 20
          lifecycle:
            # Keep serving while the pod leaves the Service and the ingress stops routing to it;
            # SIGTERM comes after this pause.
            preStop:
              sleep:
                seconds: 10
