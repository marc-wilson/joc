apiVersion: apps/v1
kind: Deployment
metadata:
  name: joc-deployment
  namespace: joc
  labels:
    app: joc-app
spec:
  # Exactly 1 replica: live updates (SSE) fan out in-process, so a second replica would
  # miss events published on the other one. Scale out only once the server moves to
  # Mongo change streams.
  replicas: 1
  # Recreate rather than RollingUpdate keeps it to one pod during deploys too.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: joc-app
  template:
    metadata:
      labels:
        app: joc-app
    spec:
      containers:
        - name: joc
          image: 'marcswilsoncontainers.azurecr.io/joc:{{ .Values.image_tag }}'
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  # From templates/secret.yaml, filled from GitHub secrets at deploy time.
                  name: joc-secrets
                  key: MONGODB_URI
            # GitHub sign-in. The server won't start in production without both.
            - name: JOC_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: joc-secrets
                  key: JOC_GITHUB_CLIENT_ID
            - name: JOC_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: joc-secrets
                  key: JOC_GITHUB_CLIENT_SECRET
            - name: JOC_PUBLIC_URL
              value: {{ required "public_url is required" .Values.public_url | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 10
