name: CI

on:
  pull_request:
    # `edited` reruns the checks when only the title changes.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets here: the repo is public and forks can open PRs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint reads every commit in the PR

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      # --ignore-scripts: CI needs no git hooks.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      # The title becomes the commit message of a squash merge, so it follows the same rules.
      - name: Lint PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

      - name: Lint commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
