name: CI

on:
  pull_request:
    # `edited` reruns the checks when only the title changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# A PR's runs replace each other. Each push to main gets a group of its own, so its checks start
# at once instead of queueing behind a deploy; the deploy job serializes itself (below).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint, typecheck, test and build. The ruleset on main requires this job by name.
  check:
    runs-on: ubuntu-24.04
    # A stuck run fails here instead of holding merges until GitHub's 6-hour limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint reads every commit in the PR

      # One MongoDB for the server tests, as a single-node replica set: live updates need change
      # streams. A step rather than a service container, since a service can't pass mongod
      # `--replSet`.
      - name: Start MongoDB
        timeout-minutes: 2
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:9.0.4 --replSet rs0 --bind_ip_all
          until docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; do
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
          until docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do
            sleep 1
          done

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      # --ignore-scripts: CI needs no git hooks.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
        timeout-minutes: 10
        env:
          JOC_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      - run: pnpm build

      # The title becomes the commit message of a squash merge, so it follows the same rules.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # Installs from GitHub update only when the plugin's version changes, so every change under
      # apps/plugin/ bumps it.
      - name: Check the plugin version was bumped
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          MANIFEST: apps/plugin/.claude-plugin/plugin.json
        run: |
          base=$(git merge-base "$BASE" HEAD)
          if git diff --quiet "$base" HEAD -- apps/plugin/; then exit 0; fi
          old=$(git show "$base:$MANIFEST" | jq -r .version)
          new=$(jq -r .version "$MANIFEST")
          if [ "$old" = "$new" ]; then
            echo "::error file=$MANIFEST::apps/plugin/ changed but the plugin version is still $old. Bump \"version\" in $MANIFEST: patch for a fix, minor for a feature."
            exit 1
          fi
          echo "Plugin version $old -> $new"

  # Build the arm64 image, push it to ACR and roll it out with Helm. Only for pushes to main;
  # every secret lives in the `production` environment, which PRs and forks never reach.
  #
  # Production always ends on the newest main. Only the tip of main deploys: an older run (one
  # that finished late, or a re-run of an old workflow) skips, and the tip's own run deploys.
  # Main only moves forward, so the tip contains every earlier merge and none is left out.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    # One deploy at a time, never cancelled mid-way (an interrupted `helm upgrade` can leave the
    # release stuck). GitHub keeps one pending job per group, so a newer deploy replaces an older
    # one still waiting, which is fine: the newer commit contains the older one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Check this is still the tip of main
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deploying $GITHUB_SHA: main is at $tip now, and its own run deploys it."
          fi

      - uses: docker/login-action@v4
        if: steps.tip.outputs.latest == 'true'
        with:
          registry: marcswilsoncontainers.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-qemu-action@v4
        if: steps.tip.outputs.latest == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.tip.outputs.latest == 'true'

      # Tagged by commit only: the chart deploys that tag, and a moving `latest` could point at an
      # older build when runs overlap.
      - uses: docker/build-push-action@v7
        if: steps.tip.outputs.latest == 'true'
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: marcswilsoncontainers.azurecr.io/joc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login
        if: steps.tip.outputs.latest == 'true'
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get K8s context
        if: steps.tip.outputs.latest == 'true'
        uses: azure/aks-set-context@v5
        with:
          resource-group: marcswilson
          cluster-name: marcswilson-cluster

      # --wait fails the job when the new pod never gets ready; the old one keeps serving.
      - name: Deploy joc
        if: steps.tip.outputs.latest == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JOC_GITHUB_CLIENT_ID: ${{ vars.JOC_GITHUB_CLIENT_ID }}
          JOC_GITHUB_CLIENT_SECRET: ${{ secrets.JOC_GITHUB_CLIENT_SECRET }}
          JOC_GITHUB_APP_ID: ${{ vars.JOC_GITHUB_APP_ID }}
          JOC_GITHUB_APP_PRIVATE_KEY: ${{ secrets.JOC_GITHUB_APP_PRIVATE_KEY }}
          JOC_GITHUB_WEBHOOK_SECRET: ${{ secrets.JOC_GITHUB_WEBHOOK_SECRET }}
        run: |
          # Main may have moved on during the build: its run is queued behind this one and
          # deploys the newer commit.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "::notice::Not deploying $GITHUB_SHA: main moved on during the build."
            exit 0
          fi
          envsubst < k8s/values.yaml | \
          helm upgrade --install joc k8s \
            -f - \
            --history-max 5 \
            --namespace joc \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set image_tag=${{ github.sha }}
