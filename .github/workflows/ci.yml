name: CI

on:
  pull_request:
    # `edited` reruns the checks when only the title changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# PR runs replace each other; a deploy is never cancelled mid-way (an interrupted `helm upgrade`
# can leave the release stuck), so pushes to main queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint, typecheck, test and build. The ruleset on main requires this job by name.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint reads every commit in the PR

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      # --ignore-scripts: CI needs no git hooks.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The title becomes the commit message of a squash merge, so it follows the same rules.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  # Build the arm64 image, push it to ACR and roll it out with Helm. Only for pushes to main;
  # every secret lives in the `production` environment, which PRs and forks never reach.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: marcswilsoncontainers.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            marcswilsoncontainers.azurecr.io/joc:latest
            marcswilsoncontainers.azurecr.io/joc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get K8s context
        uses: azure/aks-set-context@v5
        with:
          resource-group: marcswilson
          cluster-name: marcswilson-cluster

      - name: Deploy joc
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JOC_GITHUB_CLIENT_ID: ${{ secrets.JOC_GITHUB_CLIENT_ID }}
          JOC_GITHUB_CLIENT_SECRET: ${{ secrets.JOC_GITHUB_CLIENT_SECRET }}
        run: |
          envsubst < k8s/values.yaml | \
          helm upgrade --install joc k8s \
            -f - \
            --history-max 5 \
            --namespace joc \
            --create-namespace \
            --set image_tag=${{ github.sha }}
