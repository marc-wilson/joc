name: Release

on:
  push:
    branches:
      - main

# Don't cancel a running release: an interrupted `helm upgrade` can leave the release
# locked in a pending state. Newer pushes queue behind it instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Every secret lives in the `production` environment, so both jobs run in it.

jobs:
  # ─── joc → ACR ────────────────────────────────────────────────────────────
  push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: marcswilsoncontainers.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            marcswilsoncontainers.azurecr.io/joc:latest
            marcswilsoncontainers.azurecr.io/joc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── joc → AKS (Helm) ─────────────────────────────────────────────────────
  deploy:
    needs: push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get K8s context
        uses: azure/aks-set-context@v5
        with:
          resource-group: marcswilson
          cluster-name: marcswilson-cluster

      - name: Deploy joc
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JOC_TOKEN: ${{ secrets.JOC_TOKEN }}
        run: |
          envsubst < k8s/values.yaml | \
          helm upgrade --install joc k8s \
            -f - \
            --history-max 5 \
            --namespace joc \
            --create-namespace \
            --set image_tag=${{ github.sha }}
